<!DOCTYPE html>
<html lang="th">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>History Detail</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/history-detail.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>

<body>

<div class="iphone-frame">

  <div class="screen">

    <!-- HEADER -->
    <div class="detail-header">

      <h1>DFU Care+</h1>

      <div class="header-right">

        <span class="header__username" data-user-name>ผู้ใช้</span>

        <div class="profile"></div>

      </div>

    </div>

    <!-- CONTENT -->
    <div class="detail-container">

      <!-- BACK -->
      <div class="back-btn" onclick="goBack()">
        <i class="fa-solid fa-arrow-left"></i>
      </div>

      <!-- TITLE -->
      <div class="detail-title">
        ประวัติการวิเคราะห์
      </div>

      <!-- DATE + POSITION -->
      <div class="detail-top">

        <div class="detail-date" data-field="date">
        </div>

        <div class="detail-position" data-field="position">
        </div>

      </div>

      <!-- IMAGE -->
      <div class="image-wrapper">

        <img
          class="detail-image"
          data-field="image"
          alt="ภาพแผล"
        >

      </div>

      <!-- RESULT -->
      <div class="result-title">
        ผลคาดการณ์ว่า!
      </div>

      <div class="result-grade" data-field="grade">
      </div>

      <!-- ADVICE -->
      <div class="advice-title">
        คำแนะนำในการดูแลเบื้องต้น
      </div>

      <div class="advice-box" data-field="advice">
      </div>

      <!-- BUTTONS -->
      <div class="detail-buttons" data-detail-actions>

        <button class="delete-btn" onclick="deleteHistory()">
          <i class="fa-regular fa-trash-can"></i>
          ลบ
        </button>

        <button class="print-btn" onclick="printPDF()">
          <i class="fa-solid fa-print"></i>
          พิมพ์
        </button>

      </div>

    </div>

  </div>

</div>


<script src="js/session.js"></script>

<script>

// ================= LOGIN CHECK =================
if (!requireLogin()) {
  throw new Error("login required");
}


// ================= USER =================
setUserNameDisplay();


// ================= GET DATA =================
const rawData =
  localStorage.getItem("selected_history");


// ================= CHECK DATA =================
if (!rawData) {

  alert("ไม่พบข้อมูล");

  window.location.href = "history.html";

}


// ================= PARSE DATA =================
const historyData = JSON.parse(rawData);


// ================= FORMAT DATE =================
const date = new Date(historyData.created_at);

const thaiDate = date.toLocaleDateString("th-TH", {
  year: 'numeric',
  month: 'long',
  day: 'numeric'
});


// ================= SET DATA =================
document.querySelector('[data-field="date"]').innerText =
  `วันที่ ${thaiDate}`;

document.querySelector('[data-field="position"]').innerText =
  historyData.wound_position || "-";

document.querySelector('[data-field="grade"]').innerText =
  `Wagner Graed : Class ${historyData.class_id}`;

document.querySelector('[data-field="advice"]').innerText =
  historyData.advice || "-";


// ================= IMAGE =================
const imageEl =
  document.querySelector('[data-field="image"]');

if (historyData.image_name) {

  imageEl.src =
    `http://127.0.0.1:8000/uploads/${historyData.image_name}`;

} else {

  imageEl.src =
    "https://via.placeholder.com/220x220?text=No+Image";

}

imageEl.onerror = function () {

  this.src =
    "https://via.placeholder.com/220x220?text=No+Image";

};


// ================= BACK =================
function goBack(){

  window.location.href = "history.html";

}

// ================= PRINT PDF =================
function printPDF(){

  const actions = document.querySelector("[data-detail-actions]");
  actions.style.display = "none";

  window.print();

  setTimeout(() => {
    actions.style.display = "flex";
  }, 500);

}
// ================= DELETE HISTORY =================
async function deleteHistory(){

  const confirmDelete =
    confirm("คุณต้องการลบข้อมูลนี้หรือไม่?");

  if(!confirmDelete){
    return;
  }

  try{

    const res = await fetch(

      `http://127.0.0.1:8000/api/delete-history/${historyData.id}`,

      {
        method: "DELETE",
        headers: getAuthHeaders(),
      }

    );

    const result = await res.json();

    if(result.error){

      alert("❌ " + result.error);

      return;

    }

    alert("✅ ลบสำเร็จ");

    localStorage.removeItem("selected_history");

    window.location.href = "history.html";

  }

  catch(err){

    console.error(err);

    alert("❌ ลบไม่สำเร็จ");

  }

}


</script>

</body>
</html>
