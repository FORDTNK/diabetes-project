<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Result</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/result.css">

</head>

<body>

<div class="iphone-frame">

  <div class="screen">

    <!-- HEADER -->
    <div class="header">

      <h1>DFU Care+</h1>

      <div style="display:flex; align-items:center; gap:10px;">

        <span class="header__username" data-user-name></span>

        <div class="profile"></div>

      </div>

    </div>

    <!-- IMAGE -->
    <img class="preview" data-result-preview alt="ภาพที่วิเคราะห์">

    <!-- LOADING -->
    <p data-result-status>
      กำลังวิเคราะห์
      <span data-loading-dots></span>
    </p>

    <!-- RESULT -->
    <div class="fade" data-result-box>

      <p class="result-title">
        ผลคาดการณ์ว่า!
      </p>

      <p class="result-grade" data-result-grade></p>

      <div class="card">

        <div class="card-title">
          คำแนะนำในการดูแลเบื้องต้น
        </div>

        <p data-result-advice></p>

      </div>

      <div class="buttons">

        <button
          class="btn btn-cancel"
          onclick="goBack()">

          ไม่บันทึก

        </button>

        <button
          class="btn btn-save"
          onclick="openSaveModal()">

          บันทึก

        </button>

      </div>

    </div>

    <!-- POPUP -->
    <div class="modal" data-save-modal hidden>

      <div class="modal-content">

        <h3>บันทึกผลการวิเคราะห์</h3>

        <input
          type="text"
          data-field="wound-location"
          placeholder="กรอกตำแหน่งแผล เช่น นิ้วโป้งเท้าซ้าย">

        <div class="modal-buttons">

          <button
            class="cancel-btn"
            onclick="closeSaveModal()">

            ยกเลิก

          </button>

          <button
            class="confirm-btn"
            onclick="saveAnalysis()">

            ยืนยัน

          </button>

        </div>

      </div>

    </div>

  </div>

</div>

<script src="js/session.js"></script>

<script>

// ================= LOGIN CHECK =================

if (!requireLogin()) {
  throw new Error("login required");
}


// ================= USER =================

setUserNameDisplay();

const previewEl = document.querySelector("[data-result-preview]");
const statusEl = document.querySelector("[data-result-status]");
const gradeEl = document.querySelector("[data-result-grade]");
const adviceEl = document.querySelector("[data-result-advice]");
const resultBoxEl = document.querySelector("[data-result-box]");
const saveModalEl = document.querySelector("[data-save-modal]");


// ================= GLOBAL =================

let predictionData = {};
let guidelineData = {};
let uploadedFilename = "";


// ================= LOAD IMAGE =================

const imageData =
  localStorage.getItem("image");

if (!imageData) {

  alert("ไม่พบรูปภาพ");

}

previewEl.src = imageData;


// ================= BASE64 TO FILE =================

function dataURLtoFile(dataurl, filename) {

  let arr = dataurl.split(',');

  let mime =
    arr[0].match(/:(.*?);/)[1];

  let bstr =
    atob(arr[1]);

  let n =
    bstr.length;

  let u8arr =
    new Uint8Array(n);

  while(n--){

    u8arr[n] =
      bstr.charCodeAt(n);

  }

  return new File(
    [u8arr],
    filename,
    { type:mime }
  );
}


// ================= CREATE FILE =================

const file =
  dataURLtoFile(imageData, `dfu_${Date.now()}.jpg`);


// ================= PREVIEW =================

previewEl.src = imageData;


// ================= PREDICT =================

const predictForm =
  new FormData();

predictForm.append("file", file);

fetch("http://127.0.0.1:8000/api/predict", {

  method: "POST",

  body: predictForm

})

.then(res => res.json())

.then(async data => {

  predictionData = data;

  setTimeout(async () => {

    statusEl.style.display = "none";

    gradeEl.innerText =
      data.grade + " (" + data.percent + "%)";

    const gradeNumber =
      data.grade.split(" ")[1];

    try {

      const res = await fetch(
        `http://127.0.0.1:8000/api/guideline/${gradeNumber}`
      );

      guidelineData =
        await res.json();

      if (
        guidelineData &&
        guidelineData.self_care_advice
      ) {

        adviceEl.innerText =
          guidelineData.self_care_advice;

      }

      else {

        adviceEl.innerText =
          "ไม่พบคำแนะนำ";

      }

    }

    catch(err){

      console.error(err);

      adviceEl.innerText =
        "โหลดคำแนะนำไม่สำเร็จ";

    }

    resultBoxEl.classList.add("show");

  }, 800);

});


// ================= BACK =================

function goBack(){

  const confirmLeave =
    confirm("คุณต้องการกลับไปสแกนใหม่หรือไม่?");

  if(confirmLeave){

    localStorage.removeItem("image");

    window.location.href =
      "scan.html";

  }

}


// ================= MODAL =================

function openSaveModal(){

  saveModalEl.hidden = false;
  saveModalEl.style.display = "flex";

}

function closeSaveModal(){

  saveModalEl.hidden = true;
  saveModalEl.style.display = "none";

}


// ================= SAVE =================

async function saveAnalysis(){

  const woundLocation =
    document.querySelector("[data-field='wound-location']")
    .value
    .trim();

  if(!woundLocation){

    alert("กรุณากรอกตำแหน่งแผล");

    return;

  }

  if(!getUserId()){

    alert("กรุณาเข้าสู่ระบบก่อนบันทึก");

    window.location.href = "login.html";

    return;

  }

  try{

    // ================= UPLOAD IMAGE =================

    const uploadForm =
      new FormData();

    uploadForm.append("file", file);

    const uploadRes =
      await fetch(
        "http://127.0.0.1:8000/api/upload",
        {
          method: "POST",
          body: uploadForm
        }
      );

    const uploadData =
      await uploadRes.json();

    console.log(uploadData);

    uploadedFilename =
      uploadData.filename;

    // ================= SAVE DATABASE =================

    const payload = {

      grade:
        predictionData.grade,

      class_id:
        predictionData.grade.split(" ")[1],

      advice:
        guidelineData.self_care_advice || "-",

      wound_position:
        woundLocation,

      image_name:
        uploadedFilename

    };

    const res =
      await fetch(
        "http://127.0.0.1:8000/api/save-analysis",
        {

          method: "POST",

          headers: getAuthHeaders({
            "Content-Type":"application/json"
          }),

          body: JSON.stringify(payload)

        }
      );

    const result =
      await res.json();

    console.log(result);

    if(result.error){

      alert(
        "❌ บันทึกไม่สำเร็จ : "
        + result.error
      );

      return;

    }

    // ================= SUCCESS =================

    alert("✅ บันทึกสำเร็จ");

    closeSaveModal();

    localStorage.removeItem("image");

    window.location.href =
      "scan.html";

  }

  catch(err){

    console.error(err);

    alert("❌ เชื่อมต่อเซิร์ฟเวอร์ไม่ได้");

  }

}

</script>

</body>
</html>
